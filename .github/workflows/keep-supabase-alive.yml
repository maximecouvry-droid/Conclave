name: Keep Supabase alive

# Le plan gratuit de Supabase met le projet en pause après 7 jours sans activité.
# Ce workflow fait une vraie lecture sur la table publique « catalog » tous les 3 jours
# (aux 1er, 4e, 7e… jour du mois, à 08:00 UTC) : l'écart maximal reste de 3 jours.
on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch: {}   # bouton « Run workflow » pour le lancer à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Lecture de la table catalog (échoue si l'API ne répond pas 200)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 30 \
            "$SUPABASE_URL/rest/v1/catalog?select=slug&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY"
          echo
